[tool.mypy]
python_version = "3.10"
# Baseline is deliberately permissive — this codebase has zero prior type
# checking, so start by just catching real errors in code that already has
# annotations, not by demanding annotations everywhere. Tightened module by
# module via the overrides below (see CLAUDE.md's refactor notes), starting
# with the web/data/ package.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    '^my-app/',
    '^scripts/archive/',
    '^\.venv/',
]

[[tool.mypy.overrides]]
module = "web.data.weather"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "web.data.history"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "web.data.voyager"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "web.data.tle"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
