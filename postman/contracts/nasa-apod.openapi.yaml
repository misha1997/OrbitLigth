openapi: 3.0.3
info:
  title: NASA Science APOD (integration subset)
  version: '2026-10-23'
  description: >-
    Verified against the live NASA Science OPTIONS contract and sample responses.
    Legacy /planetary/apod currently returns 500. WordPress ignores legacy
    start_date/end_date and requires YYMMDD date_from/date_to. URL identifies
    the HTML article; hdurl identifies the image/poster; basic_html contains video embeds.
servers:
  - url: https://science.nasa.gov/wp-json/wp/v2
security: []
paths:
  /apod-basic:
    get:
      operationId: apodList
      parameters:
        - in: query
          name: per_page
          schema: {type: integer, default: 25}
        - in: query
          name: page
          schema: {type: integer, default: 1}
        - in: query
          name: date_from
          schema: {type: string, pattern: '^\d{6}$', example: '261021'}
        - in: query
          name: date_to
          schema: {type: string, pattern: '^\d{6}$', example: '261023'}
      responses:
        '200':
          description: Published entries, newest first.
          headers:
            X-WP-TotalPages:
              schema: {type: integer}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Apod'}
        '400': {description: Invalid date parameter.}
        '500': {description: Upstream failure; must not be cached as an empty successful day.}
components:
  schemas:
    Apod:
      type: object
      required: [date, title, media_type, url]
      properties:
        date: {type: string, format: date}
        title: {type: string}
        explanation: {type: string, description: HTML, not plain text.}
        credit: {type: string, description: HTML attribution.}
        copyright: {type: string}
        media_type: {type: string, enum: [image, video]}
        url: {type: string, format: uri, description: Article page, not an image or video URL.}
        permalink: {type: string, format: uri}
        hdurl: {type: string, format: uri, description: Full image or video poster.}
        basic_html: {type: string, description: Includes the actual iframe/video source for video APODs.}
